services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=15m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
      # MITRE ATT&CK STIX bundle for the mitre_attack_mapper tool (read-only).
      # Mounted at the same path inside the container so the tool's
      # stix_bundle_path valve default resolves without change.
      - /home/wwwombat/data/attack/enterprise-attack.json:/home/wwwombat/data/attack/enterprise-attack.json:ro
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>&format=json
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://kokoro-web:3000/api/v1
      - AUDIO_TTS_OPENAI_API_KEY=not-needed
      - AUDIO_TTS_MODEL=model
      - AUDIO_TTS_VOICE=af_heart
    depends_on:
      - ollama
      - searxng
      - kokoro-web
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    restart: unless-stopped

  kokoro-web:
    image: ghcr.io/eduardolat/kokoro-web:latest
    container_name: kokoro-web
    environment:
      - KW_SECRET_API_KEY=not-needed
    volumes:
      - kokoro-cache:/kokoro/cache
    restart: unless-stopped

volumes:
  ollama:
    external: true
  open-webui:
    external: true
  kokoro-cache:
